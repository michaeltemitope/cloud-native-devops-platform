# ============================================================
# OpsByTemitope Backend – Development Profile
# Used when SPRING_PROFILES_ACTIVE=dev  (default)
# Assumes PostgreSQL + Redis running locally or via Docker Compose
# ============================================================

spring:

  # ── DataSource ────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opsbytemitope_dev}
    username: ${DB_USERNAME:opsbytemitope}
    password: ${DB_PASSWORD:opsbytemitope_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OpsByTemitope-Dev-Pool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000

  # ── JPA ───────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Redis ─────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 4
          max-idle: 4
          min-idle: 0

  cache:
    type: redis
    redis:
      time-to-live: 300000    # 5 min – shorter TTL aids local testing

  # ── Dev tools ─────────────────────────────────────────────
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# ── Actuator (expose everything locally) ────────────────────
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# ── Logging ──────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.opsbytemitope: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
