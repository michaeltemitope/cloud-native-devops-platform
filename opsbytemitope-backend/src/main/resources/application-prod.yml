# ============================================================
# OpsByTemitope Backend – Production Profile
# Used when SPRING_PROFILES_ACTIVE=prod
# All sensitive values MUST be supplied via environment variables.
# No secrets are hardcoded here.
# ============================================================

spring:

  # ── DataSource ────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OpsByTemitope-Prod-Pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 30000
      leak-detection-threshold: 60000

  # ── JPA ───────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: false

  # ── Redis ─────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:16}
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000    # 10 min

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

# ── Actuator (restricted in production) ─────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ── Server hardening ─────────────────────────────────────────
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# ── Logging ──────────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.opsbytemitope: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    # Structured single-line format – easy to ingest into log aggregators
    console: "{\"time\":\"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}\",\"level\":\"%level\",\"thread\":\"%thread\",\"logger\":\"%logger{36}\",\"traceId\":\"%X{traceId:-}\",\"message\":\"%msg\"}%n"
  file:
    name: ${LOG_FILE:/var/log/opsbytemitope/app.log}
    max-size: 100MB
    max-history: 30
    total-size-cap: 3GB
