# ============================================================
# OpsByTemitope Backend – Base / Shared Configuration
# Profile-specific overrides live in application-dev.yml
# and application-prod.yml
# ============================================================

spring:
  application:
    name: opsbytemitope-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── Jackson ──────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # ── JPA (shared, non-environment-specific) ───────────────
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ── Flyway (shared) ──────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

# ── Server ──────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain

# ── Actuator ────────────────────────────────────────────────
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

# ── Application info (exposed via /actuator/info) ──────────
info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'
    description: Cloud-native task and project management platform

# ── App-level settings ──────────────────────────────────────
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-use-a-256-bit-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 h default

# ── SpringDoc / Swagger ─────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false
