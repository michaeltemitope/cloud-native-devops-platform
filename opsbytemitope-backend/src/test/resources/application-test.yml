# ============================================================
# OpsByTemitope Backend – Test Profile
# Used by unit and slice tests (H2 in-memory database).
# Integration tests override datasource via Testcontainers.
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:opsbytemitope_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6370    # intentionally unused port – tests mock the cache layer

  cache:
    type: none      # disable Redis caching in unit/slice tests

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs256-algorithm-256bits
    expiration-ms: 3600000

logging:
  level:
    root: WARN
    com.opsbytemitope: INFO
